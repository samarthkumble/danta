name: Keep the demo database awake
# The free Supabase project pauses after a week without activity. This pings the live demo's health
# check twice a day so judges always find it running. Remove after the hackathon's judging period.
on:
  schedule:
    - cron: "23 1,13 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health check
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 30 https://danta-inky.vercel.app/api/health; then exit 0; fi
            sleep 20
          done
          exit 1
