name: Eval
# Runs the 20-quote evaluation with the real model. Needs the repository secret GEMINI_API_KEY.
on: workflow_dispatch
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval/results.md
            eval/results.json
            eval/cache.json
